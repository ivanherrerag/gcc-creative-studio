steps:
  # Step 1: Build the container image using the standard Docker builder.
  # Using SHORT_SHA for the tag is a best practice for traceability.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    env: ['DOCKER_BUILDKIT=1']
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
        '.',
      ]
    # This ensures the build context is the 'backend' folder
    dir: 'backend'

  # Step 2: Push the container image to Google Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
      ]

  # Step 3: Deploy to Cloud Run using the gcloud CLI builder.
  # This command updates the service with the new image, creating a new revision.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--set-env-vars=USE_CLOUD_SQL_AUTH_PROXY=false,INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},GENMEDIA_BUCKET=${_GENMEDIA_BUCKET},ENVIRONMENT=production,FRONTEND_URL=${_FRONTEND_URL},BACKEND_URL=${_BACKEND_URL},WORKFLOWS_EXECUTOR_URL=${_BACKEND_URL}/api/workflows-executor,SIGNING_SA_EMAIL=${_SIGNING_SA_EMAIL},GOOGLE_TOKEN_AUDIENCE=${_GOOGLE_TOKEN_AUDIENCE}'
      - '--set-secrets=DB_PASS=creative-studio-db-password:latest'
      - '--quiet' # Suppress interactive prompts for CI/CD environments

# BEST PRACTICE: Explicitly declare the image(s) built by this pipeline.
# This integrates the build with Google Cloud's security features, like showing
# vulnerability scan results in the Cloud Build UI.
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'

# Substitutions will be passed in from the Cloud Build trigger.
# You can override these for manual runs.
substitutions:
  _SERVICE_NAME: 'creative-studio-backend'
  _REPO_NAME: 'cs-be-development-repo' # This matches local.artifact_repo_id
  _REGION: 'us-central1' # TODO: Make Region generic from users input
  _INSTANCE_CONNECTION_NAME: 'toc-creative-studio-506217:us-central1:creative-studio-db-dbbc887d'
  _DB_NAME: 'creative_studio'
  _DB_USER: 'studio_user'
  _GENMEDIA_BUCKET: 'toc-creative-studio-506217-cs-development-bucket'
  _FRONTEND_URL: 'https://toc-creative-studio-506217.web.app'
  _BACKEND_URL: 'https://cstudio-be-711911603993.us-central1.run.app'
  _SIGNING_SA_EMAIL: 'cs-development-read@toc-creative-studio-506217.iam.gserviceaccount.com'
  _GOOGLE_TOKEN_AUDIENCE: '711911603993-md3br7h69tjrkk2ct195qd1d7h3duse5.apps.googleusercontent.com'

options:
  logging: CLOUD_LOGGING_ONLY
